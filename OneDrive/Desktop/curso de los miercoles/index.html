<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Presentación - Ian Gael Pérez Ojeda</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 32px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        h1 {
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .tagline {
            color: #94a3b8;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section {
            margin-top: 20px;
            background: #0f172a;
            padding: 16px;
            border-radius: 10px;
            border-left: 4px solid #3b82f6;
        }

        .section h2 {
            font-size: 1rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .section p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #cbd5e1;
        }

        .skills-section {
            border-left-color: #a855f7;
        }

        .skills-section h2 {
            color: #c084fc;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-header">
            <div class="avatar">IP</div>
            <h1>Ian Gael Pérez Ojeda</h1>
            <p class="tagline">Tarjeta de Presentación</p>
        </div>

        <div class="section">
            <h2>Sobre mí & Pasatiempos</h2>
            <p>Me gusta escuchar música, ver videos, crear historias, entre otros pasatiempos creativos.</p>
        </div>

        <div class="section skills-section">
            <h2>Cualidades & Habilidades</h2>
            <p>Soy bueno ordenando y caminando largas distancias.</p>
        </div>
    </div>

</body>
</html>
